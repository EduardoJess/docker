# Configuración de tu reverse proxy. Complétala siguiendo el README.
# Después de cambiar este fichero:  docker compose restart proxy

# DNS interno de Docker. Déjalo como está: hace falta para que Nginx encuentre los
# servicios por su nombre.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name localhost;

    location = /quien {
        return 301 /quien/;
    }

    location /quien/ {
        set $quien http://quien:80;
        rewrite ^/quien/(.*)$ /$1 break;
        proxy_pass $quien;
        proxy_set_header Host $host;
    }

    location / {
        set $web http://web:80;
        proxy_pass $web;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name archivos.localhost;

    location / {
        set $archivos http://archivos:80;
        proxy_pass $archivos;
        proxy_set_header Host $host;
    }
}