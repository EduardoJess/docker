services:
  uploader:
    image: filebrowser/filebrowser:v2.23.0
    container_name: uploader
    environment:
      - USERNAME=${UPLOADER_USERNAME}
      - PASSWORD=${UPLOADER_PASSWORD}
    volumes:
      - ${RUTA_BASE}:/srv
    ports:
      - "${PORT_FILEBROWSER}:80"
    restart: unless-stopped

  firefox:
    image: jlesage/firefox
    ports:
      - "${PORT_FIREFOX}:5800"
      
  obsidian:
    image: lscr.io/linuxserver/obsidian:latest
    container_name: obsidian   # <--- ¡ERROR DE ESCRITURA! Demasiados espacios a la izquierda
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Etc/UTC
    ports:
      - "${PORT_OBSIDIAN}:3000"
      - "3001:3001"
    shm_size: "1gb"
    restart: unless-stopped

  libreoffice:
    image: lscr.io/linuxserver/libreoffice:latest
    container_name: libreoffice
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Etc/UTC
    ports:
      - "${PORT_LIBREOFFICE}:3000" # <--- ¡ERROR LÓGICO! Este puerto ya está ocupado arriba
      - "3003:3000"
    shm_size: "1gb"
    restart: unless-stopped